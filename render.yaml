# Synthetic-demo deploy config for Render.
# Frontend must use runtime: node so Render runs npm install before build.
services:
  - type: web
    name: sih-criminal-frontend
    runtime: node
    rootDir: apps/frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

  - type: web
    name: sih-criminal-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app_ner_demo:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
